<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StreamCatch Download All</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="download">
    <header class="header">
      <div>
        <h1>Download all</h1>
        <p id="countSubtitle" class="subtitle">Queue every captured link through ffmpeg</p>
      </div>
    </header>

    <form id="bulkForm" class="form">
      <label class="field">
        <span>Save folder</span>
        <input
          id="downloadDir"
          type="text"
          placeholder="Downloads/StreamCatch"
          autocomplete="off"
          required
        />
        <small>Defaults to Downloads/StreamCatch in your home folder.</small>
      </label>

      <label class="check-row" id="useTitleRow">
        <input id="useTitle" type="checkbox" />
        <span class="check-copy">
          <span class="check-label">Use video titles as filenames</span>
          <small id="titleExample" class="title-example">Example: —</small>
        </span>
      </label>

      <div id="templateFields">
        <label class="field">
          <span>Filename template</span>
          <input
            id="nameTemplate"
            type="text"
            value="video_{n:3}"
            autocomplete="off"
            required
          />
          <small>
            Tokens: <code>{n}</code> number,
            <code>{n:3}</code> / <code>{###}</code> / <code>###</code> padded number,
            <code>{a}</code> / <code>{A}</code> letters.
            Examples:
            <code>{###}</code> → 001,
            <code>video_{n:3}</code> → video_001,
            <code>{a}_clip</code> → a_clip,
            <code>test-{n:2}</code> → test-01
          </small>
          <small id="previewHint" class="preview-hint"></small>
        </label>

        <label class="field">
          <span>Quick templates</span>
          <select id="templatePresets">
            <option value="">Choose an example…</option>
            <option value="{###}">001, 002, …</option>
            <option value="video_{n:3}">video_001, video_002, …</option>
            <option value="{a}_clip">a_clip, b_clip, …</option>
            <option value="{A}_clip">A_clip, B_clip, …</option>
            <option value="test-{n:2}">test-01, test-02, …</option>
            <option value="{n}">1, 2, 3, …</option>
          </select>
        </label>

        <label class="field">
          <span>Start at</span>
          <input
            id="startAt"
            type="text"
            value="1"
            autocomplete="off"
            required
          />
          <small>Use a number (<code>1</code>) or a letter (<code>a</code> / <code>C</code>).</small>
        </label>
      </div>

      <label class="field">
        <span>If a file already exists</span>
        <select id="conflictMode">
          <option value="rename">Auto-rename (add _2, _3, …)</option>
          <option value="skip">Skip</option>
          <option value="overwrite">Overwrite</option>
        </select>
      </label>

      <p id="status" class="status" role="status"></p>
      <ol id="progressList" class="progress-list"></ol>

      <div class="form-actions">
        <button id="cancelBtn" class="btn btn-ghost" type="button">Cancel</button>
        <button id="submitBtn" class="btn" type="submit">Download all</button>
      </div>
    </form>

    <script src="bulk-download.js"></script>
  </body>
</html>
